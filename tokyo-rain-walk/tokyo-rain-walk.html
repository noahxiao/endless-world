  .sheet button.primary { background: var(--signal); color: #04241e; border-color: var(--signal); font-weight: 700; }

/* ============================================================

   ============================================================ */
const PI = Math.PI, TAU = PI * 2;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashInts(a, b, c) { let h = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1) ^ Math.imul(c | 0, 0x85EBCA77); h = Math.imul(h ^ h >>> 16, 0x7feb352d); h = Math.imul(h ^ h >>> 15, 0x846ca68b); return (h ^ h >>> 16) >>> 0; }

/* ============================================================
   Street grid
   Axis 0 lines run along z (x = const), axis 1 lines run along x (z = const).
   Japan drives on the left.
   ============================================================ */
const LT = {
  ave:    { key: 'ave',    road: 14,  walk: 4.6, off: 9.3,  cars: 2, vmax: 12.5 },
  street: { key: 'street', road: 7,   walk: 3.2, off: 4.7,  cars: 1, vmax: 8.5 },

const halfW = t => t.road / 2 + t.walk;
function lineType(axis, i) {
  const off = axis ? (SEED % 5) : ((SEED >>> 3) % 5);

const posCache = [new Map(), new Map()];
function gap(axis, i) {
  const a = lineType(axis, i), b = lineType(axis, i + 1);
  const block = 30 + h01(axis, i, 23) * 38;
  return halfW(a) + block + halfW(b);
}
function linePos(axis, i) {
  const m = posCache[axis];
  let v = m.get(i); if (v !== undefined) return v;
  if (!m.has(0)) m.set(0, 0);
  if (i === 0) { m.set(0, 0); return 0; }

  while (!m.has(k)) k += step;

  while (k !== i) {
    if (i > 0) { v += gap(axis, k); k++; } else { v -= gap(axis, k - 1); k--; }
    m.set(k, v);
  }
  return v;
}
// index of the line at or before coordinate c
function lineAt(axis, c) {
  let i = Math.round(c / 62);
  while (linePos(axis, i) > c) i--;
  while (linePos(axis, i + 1) <= c) i++;

}
// car lane lateral offsets (distance from centre line, on the left of travel)
function laneOffs(t) { return t.cars === 2 ? [5.25, 1.75] : t.cars === 1 ? [1.75] : []; }

/* ---------------- Districts ---------------- */
const DISTRICTS = {

function districtCell(bi, bj) { return [Math.floor(bi / DCELL), Math.floor(bj / DCELL)]; }
function districtType(ci, cj) {

/* ---------------- Traffic signals ----------------
   Cycle of 36 s. Axis-0 cars (moving along z) green 0–15, yellow 15–17.
   Axis-1 cars green 18–33, yellow 33–35. Pedestrians cross alongside the
   green traffic: crossing an axis-1 road (walking along z) is allowed 0–11,
   flashing 11–15; crossing an axis-0 road allowed 18–29, flashing 29–33. */
const SIG_P = 36;
const nodeSignalized = (i, j) => lineType(0, i).cars > 0 || lineType(1, j).cars > 0;

function carSig(axis, i, j, t) {
  const u = sigU(i, j, t);
  if (axis === 0) return u < 15 ? 0 : u < 17 ? 1 : 2;
  return u >= 18 && u < 33 ? 0 : u >= 33 && u < 35 ? 1 : 2;

// ra = axis of the road being crossed
function walkSig(ra, i, j, t) {
  const u = sigU(i, j, t);
  if (ra === 1) return u < 11 ? [0, 11 - u] : u < 15 ? [1, 0] : [2, 0];

const GLSL_SAN = `
vec3 sanHDR(vec3 c){ uvec3 u = floatBitsToUint(c); bvec3 bad = equal(u & uvec3(0x7f800000u), uvec3(0x7f800000u)); bvec3 nan = notEqual(u & uvec3(0x007fffffu), uvec3(0u));

const GLSL_NOISE = `
vec3 sanHDR(vec3 c){ uvec3 u = floatBitsToUint(c); bvec3 bad = equal(u & uvec3(0x7f800000u), uvec3(0x7f800000u)); bvec3 nan = notEqual(u & uvec3(0x007fffffu), uvec3(0u));
  c = vec3(bad.x ? (nan.x ? 0.0 : 48.0) : c.x, bad.y ? (nan.y ? 0.0 : 48.0) : c.y, bad.z ? (nan.z ? 0.0 : 48.0) : c.z); return clamp(c, 0.0, 48.0); }

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  float h = hash12(ci+sd);
  vec2 c = (vec2(hash12(ci+sd+3.1), hash12(ci+sd+7.7))-0.5)*0.45;
  float ph = fract(t*(0.7+0.5*h) + h);

/* ============================================================
   Route reset
   ============================================================ */
function resetWorld(seed) {
  SEED = seed >>> 0 || 1; posCache[0].clear(); posCache[1].clear();
  for (const b of BLOCKS.values()) unrealize(b); BLOCKS.clear();

  CARS.list.length = 0; PEDS.list.length = 0; for (const l of PL) { l.userData.src = null; l.intensity = 0; }
  wkInit(); CAMS.yaw = 0; CAMS.glance = null; ST.lastDistrict = ''; CHIMED.clear();

  const x = _p1[0], z = _p1[1];
  camera.position.set(x, 1.62, z);
  while (updateBlocks(x, z, 400) > 0);

/* ============================================================
   Main loop
   ============================================================ */
const CHIMED = new Set();

const audioState = { rain: 0.6, cars: [], sig: null };
